<!DOCTYPE html>
<!-- Página dentro de /pages: para salir a la raíz se usa "../" en css, imágenes e Inicio -->
<html lang="es">

<head>
   <meta charset="UTF-8">
   <!-- Necesario para que la web sea responsive en el móvil -->
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Contacto · Óscar Solano</title>
   <!-- Fuente Inter de Google Fonts -->
   <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter">
   <!-- Hoja de estilos: está una carpeta más arriba -->
   <link rel="stylesheet" href="../css/main.css">
</head>

<body>

   <!-- Cabecera con el título de la página y el menú -->
   <header>

      <h1>Contacto</h1>

      <nav>
         <ul>
            <li><a href="../index.html">Inicio</a></li>
            <li><a href="biografia.html">Biografía</a></li>
            <li><a href="contacto.html">Contacto</a></li>
            <li><a href="portfolio.html">Portfolio</a></li>
         </ul>
      </nav>

   </header>

   <main>

      <!-- Sección de contacto con el formulario.
           Cada label se enlaza con su input mediante for / id -->
      <section id="contacto">

         <h2>Ponte en contacto conmigo</h2>

         <form>

            <label for="cliente">Tu nombre</label>
            <input type="text" id="cliente" name="cliente">

            <label for="apellidos">Tus apellidos</label>
            <input type="text" id="apellidos" name="apellidos">

            <label for="profesion">Tu profesión</label>
            <input type="text" id="profesion" name="profesion">

            <label for="sector">Tu sector</label>
            <input type="text" id="sector" name="sector">

            <!-- type="email" y "tel" validan/adaptan el teclado en el móvil -->
            <label for="correo">Indica tu correo electrónico</label>
            <input type="email" id="correo" name="correo">

            <label for="movil">Tu móvil</label>
            <input type="tel" id="movil" name="movil">

            <!-- Mensaje de máximo 250 caracteres -->
            <label for="mensaje">Tu mensaje</label>
            <textarea id="mensaje" name="mensaje" maxlength="250"></textarea>

            <button type="submit">Enviar</button>

         </form>

      </section>

   </main>

   <!-- Pie de página -->
   <footer>
      <p>&copy; 2026 Óscar Solano</p>
      <p><a href="contacto.html">Contacto</a></p>
   </footer>

</body>

</html>
